<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Super Painel TJMG</title>
<style>
/* ===== Design system: tokens ===== */
:root{
  --bg:#f3f5f9;--surface:#fff;--surface-2:#f7f9fc;--bd:#d9e0ea;--tx:#0f1b2d;--mut:#44546a;
  --brand:#123a73;--accent:#1c5cc8;--accent-soft:#e6eefc;
  --ok:#15803d;--ok-soft:#e5f5ea;--warn:#a85a00;--warn-soft:#fdf0dc;--crit:#b42318;--crit-soft:#fde8e6;--info:#0b6a8f;--info-soft:#e3f2f8;
  --side-bg:#0f2a52;--side-tx:#d3e2ff;--side-act:#1f5fc4;
  --c1:#1c5cc8;--c2:#15803d;--c3:#c2610c;--c4:#6b46c1;
  --sh:0 1px 2px rgb(15 27 45 / .06),0 1px 3px rgb(15 27 45 / .08);--r:12px;--r-sm:8px;--gap:16px;
  --fs-title:1.6rem;--fs-mod:1.15rem;--fs-sub:.88rem;--fs-kpi:2rem;--fs-lab:.78rem;--fs-tab:.84rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1322;--surface:#131f36;--surface-2:#182744;--bd:#2a3b5c;--tx:#e9eefb;--mut:#a9b8d3;
  --accent:#6fa3ff;--accent-soft:#1b2f57;--ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf5a;--warn-soft:#3a2a0d;--crit:#ff8a80;--crit-soft:#3d1713;--info:#5cc4ea;--info-soft:#0f2f3d;
  --side-bg:#08162d;--side-tx:#c5d6f7;--side-act:#2563d6;--c1:#6fa3ff;--c2:#4ade80;--c3:#fb923c;--c4:#b794f4;--sh:0 1px 2px rgb(0 0 0 / .4);}}
:root[data-theme="dark"]{
  --bg:#0b1322;--surface:#131f36;--surface-2:#182744;--bd:#2a3b5c;--tx:#e9eefb;--mut:#a9b8d3;
  --accent:#6fa3ff;--accent-soft:#1b2f57;--ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf5a;--warn-soft:#3a2a0d;--crit:#ff8a80;--crit-soft:#3d1713;--info:#5cc4ea;--info-soft:#0f2f3d;
  --side-bg:#08162d;--side-tx:#c5d6f7;--side-act:#2563d6;--c1:#6fa3ff;--c2:#4ade80;--c3:#fb923c;--c4:#b794f4;--sh:0 1px 2px rgb(0 0 0 / .4);}

/* ===== base ===== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;z-index:300;border-radius:6px}
.skip:focus{left:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}
h1{font-size:var(--fs-title);line-height:1.2}
h2{font-size:var(--fs-mod)}
h3{font-size:var(--fs-sub);color:var(--mut);font-weight:600;margin:16px 0 8px}
button{font:inherit;color:inherit}
.meta{font-size:.82rem;color:var(--mut);margin:4px 0 10px}
.erro{color:var(--crit)}
a{color:var(--accent)}

/* ===== casca: topo + lateral + conteúdo ===== */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--brand);color:#fff;box-shadow:var(--sh)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{letter-spacing:.06em;font-size:1rem}.brand span{font-size:.72rem;opacity:.85;letter-spacing:.04em}
.icon-btn{background:transparent;border:1px solid rgb(255 255 255 / .35);color:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:rgb(255 255 255 / .12)}
#menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch input[type=search]{width:100%;padding:9px 12px 9px 40px;border-radius:8px;border:1px solid transparent;background:#fff;color:#0f1b2d;font:inherit}
.gsearch .lupa{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#44546a;pointer-events:none}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r-sm);box-shadow:0 8px 24px rgb(0 0 0 / .25);max-height:70vh;overflow:auto;z-index:200}
.gres h4{margin:0;padding:8px 12px 4px;font-size:.72rem;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.gres button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
.gres button:hover,.gres button:focus-visible{background:var(--accent-soft)}
.gres small{color:var(--mut)}
.fresh{font-size:.74rem;line-height:1.25;text-align:right;white-space:nowrap}
.fresh b{display:block;font-weight:600}
.fontes{display:flex;gap:10px;font-size:.74rem;flex-wrap:wrap}
.fontes span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9aa6b8}
.dot.ok{background:#4ade80}.dot.warn{background:#fbbf5a}.dot.err{background:#ff8a80}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{background:var(--side-bg);color:var(--side-tx);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto}
.side h2{font-size:.68rem;letter-spacing:.1em;color:#8fa6cf;margin:14px 10px 4px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;color:var(--side-tx);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:.9rem}
.side a:hover{background:rgb(255 255 255 / .08)}
.side a[aria-current="page"]{background:var(--side-act);color:#fff;font-weight:600}
.side .modo{margin-top:auto;padding:10px;border-top:1px solid rgb(255 255 255 / .12)}
.side .modo p{margin:0 0 6px;font-size:.7rem;color:#8fa6cf}
.seg{display:flex;border:1px solid rgb(255 255 255 / .3);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--side-tx);padding:6px;font-size:.8rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--side-act);color:#fff;font-weight:600}
.side .btn-lado{margin:8px 0 0;width:100%;background:transparent;border:1px solid rgb(255 255 255 / .3);color:var(--side-tx);border-radius:8px;padding:6px;font-size:.8rem;cursor:pointer}
main{padding:20px 22px 40px;min-width:0}
.view-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.view-head p{margin:2px 0 0;color:var(--mut);font-size:var(--fs-sub)}
footer{padding:0 22px 28px;color:var(--mut);font-size:.8rem}

/* ===== componentes ===== */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.card+.card,.bloco+.bloco{margin-top:var(--gap)}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.grid{display:grid;gap:var(--gap)}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-1{grid-template-columns:1fr}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mt{margin-top:var(--gap)}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--bd);border-radius:var(--r);padding:14px;background:var(--surface);box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:inherit;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi .ic{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:var(--fs-lab);font-weight:600}
.kpi .ic svg{color:var(--accent);flex:none}
.kpi .v{font-size:var(--fs-kpi);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .s{font-size:.76rem;color:var(--mut)}
.kpi.crit .ic svg{color:var(--crit)}.kpi.warn .ic svg{color:var(--warn)}
.kpi.nolink{cursor:default}
.tend{font-size:.78rem;font-weight:600}
.tend.up{color:var(--ok)}.tend.down{color:var(--crit)}.tend.eq{color:var(--mut)}
.atencao{border:1px solid var(--bd);border-left:5px solid var(--crit);background:linear-gradient(0deg,var(--surface),var(--surface));border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.atencao > header{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--crit);font-weight:700}
.alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.alerta{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--bd)}
.alerta .n{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.alerta .t{font-size:.82rem}
.alerta.crit{background:var(--crit-soft)}.alerta.warn{background:var(--warn-soft)}.alerta.info{background:var(--info-soft)}
.selo{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.alerta.crit .selo{color:var(--crit)}.alerta.warn .selo{color:var(--warn)}.alerta.info .selo{color:var(--info)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;padding:6px 11px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--surface);color:var(--tx);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:5px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--surface);color:var(--mut);cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.88rem}
.rows div:last-child{border:0}.rows b{font-variant-numeric:tabular-nums}
.sub-card{border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.sub-card h3{margin:0 0 6px;color:var(--tx)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.mini .kpi{box-shadow:none;cursor:default;padding:10px}
.mini .kpi .v{font-size:1.35rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:var(--surface-2);border:1px solid var(--bd);border-radius:8px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.barras{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;gap:5px 10px;align-items:center;font-size:.85rem}
.barras .r{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barras .t{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px;height:14px}
.barras .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.barras .n{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:10px}
.chart text.val{fill:var(--tx)}
.chart .grid-l{stroke:var(--bd);stroke-dasharray:3 3}
.chart rect.bar:hover{opacity:.75}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin:6px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
details.dados{margin-top:6px;font-size:.8rem;color:var(--mut)}
details.dados summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:var(--fs-tab);font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
table.num th,table.num td{text-align:right}
table.num th:first-child,table.num td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;background:var(--surface)}
tr.tot td{font-weight:700;background:var(--accent-soft)}
tr.sub td{color:var(--mut);font-size:.78rem}
.rolagem{position:relative;max-height:360px;overflow:auto;border:1px solid var(--bd);border-radius:var(--r-sm)}
select,input[type=search],input[type=number]{font:inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--surface);color:var(--tx);max-width:100%}
.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.badge.aten{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge.alto{background:var(--warn-soft);color:var(--crit);border-color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.tproc{position:relative;max-height:620px;overflow:auto;border:1px solid var(--bd);border-radius:var(--r-sm)}
.tproc table{min-width:760px}
.tproc th{position:sticky;top:0;z-index:2;white-space:nowrap}
.tproc th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-weight:600}
.tproc td{text-align:left;vertical-align:top}
.tproc td.n,.tproc th.n{text-align:right}
.copiar{all:unset;cursor:copy;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent);border-bottom:1px dotted var(--accent)}
.copiar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pag{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:.84rem;color:var(--mut)}
.barra-busca{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.barra-busca input{flex:1;min-width:220px}
details.avancados{margin:8px 0;border:1px solid var(--bd);border-radius:var(--r-sm);padding:6px 10px;background:var(--surface-2)}
details.avancados summary{cursor:pointer;font-weight:600;font-size:.86rem}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
dialog.gaveta{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(480px,100vw);border:0;border-left:1px solid var(--bd);background:var(--surface);color:var(--tx);padding:18px;overflow:auto;box-shadow:-8px 0 24px rgb(0 0 0 / .25)}
dialog.gaveta::backdrop{background:rgb(0 0 0 / .4)}
dialog.gaveta dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.88rem}
dialog.gaveta dt{color:var(--mut)}dialog.gaveta dd{margin:0;word-break:break-word}
.progresso{height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--bd);overflow:hidden}
body[data-modo="gerencial"] .detalhe{display:none}
.view[hidden]{display:none}

/* ===== responsivo ===== */
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  #menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:54px;bottom:0;width:260px;height:auto;z-index:150;transform:translateX(-100%);transition:transform .18s}
  .side.aberto{transform:none;box-shadow:8px 0 24px rgb(0 0 0 / .35)}
  .fontes,.fresh span.det{display:none}
  main{padding:14px}
}
@media (max-width:560px){.fresh{display:none}.brand span{display:none}.view-head{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  .topbar,.side,.gsearch,.chips,.barra-busca,details.avancados,.pag button,.btn,.tabs{display:none!important}
  .shell{display:block}.view{display:block!important}.view[hidden]{display:block!important}
  body{background:#fff;color:#000}.card,.kpi{box-shadow:none;break-inside:avoid;border-color:#999}
  .tproc{max-height:none;overflow:visible}main{padding:0}
}
  .btn-atualizar{white-space:nowrap;font-size:.84rem;padding:6px 12px;border-radius:8px;border:1px solid rgb(255 255 255 / .35);color:#fff;text-decoration:none}
  .btn-atualizar:hover{background:rgb(255 255 255 / .12)}
  @media print{.btn-atualizar{display:none}}
  .vazio { max-width: 560px; margin: 12vh auto; padding: 24px; text-align: center; font: 16px/1.5 system-ui, sans-serif; }
</style>
</head>
<body data-modo="detalhado">
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<header class="topbar" role="banner">
  <button id="menu-btn" class="icon-btn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="side"></button>
  <div class="brand"><b>SUPER PAINEL</b><span id="brand-comarca"></span></div>
  <div class="gsearch" role="search">
    <span class="lupa" id="lupa"></span>
    <input id="gs" type="search" placeholder="Pesquisar processo, tarefa, classe, assunto ou módulo…" aria-label="Pesquisa global" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gres">
    <div class="gres" id="gres" role="listbox" hidden></div>
  </div>
  <div class="fresh" id="fresh" aria-live="polite"></div>
  <div class="fontes" id="fontes" aria-label="Status das fontes de dados"></div>
  <a id="atualizar" class="btn-atualizar" href="coleta.html">Atualizar dados</a>
  <button id="tema" class="icon-btn" type="button" aria-label="Alternar tema (automático, claro, escuro)"></button>
</header>
<div class="shell">
  <nav id="side" class="side" aria-label="Navegação principal"></nav>
  <main id="conteudo" tabindex="-1"><div id="views"></div></main>
</div>
<footer id="rodape"></footer>
<dialog id="gaveta" class="gaveta" aria-labelledby="gaveta-t"></dialog>
<script type="module" src="painel/carregar.js"></script>
</body>
</html>
